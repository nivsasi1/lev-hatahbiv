# Toolbox: freeze the catalogue (all products + settings, exactly as stored)
# into Backend/snapshots/<date>[-label].json and commit it to main — a point
# the ops-restore workflow can bring the database back to. Take one before a
# round of risky edits. Requires the DB_URL repository secret.
name: ops-snapshot

on:
  # Sundays 01:00 UTC = 03:00 Israel in winter, 04:00 in summer: a restore
  # point every week, skipped when nothing changed since the last snapshot
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:
    inputs:
      label:
        description: "Optional label for the file name (e.g. before-manager-edits)"
        required: false
        default: ""

permissions:
  contents: write

# never overlap a publish commit on main
concurrency:
  group: publish-catalog
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps (mongoose)
        working-directory: Backend
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Snapshot products + settings from Atlas
        id: snap
        working-directory: Backend
        env:
          DB_URL: ${{ secrets.DB_URL }}
          LABEL: ${{ inputs.label }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          [ -n "$DB_URL" ] || { echo "::error::DB_URL secret not set (repo Settings → Secrets → Actions)"; exit 1; }
          if [ "$SCHEDULED" = "true" ]; then
            node scripts/snapshot.js weekly --scheduled
          else
            node scripts/snapshot.js "$LABEL"
          fi

      - name: Commit the snapshot to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Backend/snapshots/
          if git diff --cached --quiet; then
            echo "Nothing to commit — the catalogue is unchanged since the last snapshot."
            exit 0
          fi
          git commit -m "snapshot: ${{ steps.snap.outputs.name || 'prune old weekly snapshots' }}"
          # main may have moved while this ran (a publish, a code push)
          git pull --rebase origin main
          git push origin main
          [ -n "${{ steps.snap.outputs.name }}" ] && echo "Restore with: ops-restore → snapshot = ${{ steps.snap.outputs.name }}"
