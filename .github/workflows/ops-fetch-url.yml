# Toolbox: fetch a public URL from the GitHub runner and print it to the job
# log (the assistant's own egress is proxied; the runner's isn't). GET only,
# no secrets, output is public in the log — for public pages/documents only.
name: ops-fetch-url

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL(s) to fetch (GET); text mode accepts several, whitespace-separated"
        required: true
      mode:
        description: "How to render the response"
        type: choice
        default: text
        options:
          - text
          - pdf-text
          - headers
      jq:
        description: "Optional jq filter applied to the response (text mode only)"
        required: false
        default: ""
      grep:
        description: "Optional extended-regex; HTML tags are stripped, then only matches are printed (text mode only)"
        required: false
        default: ""

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch
        env:
          URL: ${{ inputs.url }}
          MODE: ${{ inputs.mode }}
          JQ_FILTER: ${{ inputs.jq }}
          GREP_PATTERN: ${{ inputs.grep }}
        run: |
          set -o pipefail
          case "$MODE" in
            headers)
              curl -sSI --max-time 30 "$URL" ;;
            pdf-text)
              sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y poppler-utils >/dev/null
              curl -sSL --max-time 60 -A "Mozilla/5.0" -o /tmp/fetched.pdf "$URL"
              pdftotext -layout /tmp/fetched.pdf - ;;
            text)
              # caps keep a huge page (or many pages) from blowing up the log
              for u in $URL; do
                echo "== $u"
                if [ -n "$JQ_FILTER" ]; then
                  { curl -sSL --max-time 60 -A "Mozilla/5.0" "$u" | jq -r "$JQ_FILTER" || echo "FETCH/JQ ERROR"; } | head -c 300000
                elif [ -n "$GREP_PATTERN" ]; then
                  { curl -sL --max-time 60 -A "Mozilla/5.0" "$u" \
                      | sed -e 's/<[^>]*>/ /g' | tr -s ' \t' ' ' \
                      | grep -oE "$GREP_PATTERN" || echo "NO MATCHES"; } | head -c 100000
                  echo
                else
                  { curl -sSL --max-time 60 -A "Mozilla/5.0" "$u" || echo "FETCH ERROR"; } | head -c 300000
                fi
              done ;;
          esac
