# Toolbox: fill hidden search keywords for whole brand families at once
# (e.g. "גולדן" on every GOLDEN product). The rules live in
# Backend/scripts/fill-search-keywords.js — add a brand there and run again.
# Dry run by default (prints the plan only); "apply" writes to Atlas and, unless
# disabled, dispatches publish-catalog so the storefront search picks the new
# keywords up. Additive + idempotent: never removes what the manager typed.
# Requires the DB_URL repository secret.
name: ops-fill-search-keywords

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the changes to the database (off = dry run, prints the plan only)"
        type: boolean
        default: false
      publish:
        description: "After applying, run publish-catalog so the live site gets the keywords"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write # dispatches publish-catalog

# never overlap a publish — it dumps the same collection this job writes to
concurrency:
  group: publish-catalog
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps (mongoose)
        working-directory: Backend
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Fill keywords
        working-directory: Backend
        env:
          DB_URL: ${{ secrets.DB_URL }}
          APPLY: ${{ inputs.apply }}
        run: |
          [ -n "$DB_URL" ] || { echo "::error::DB_URL secret not set (repo Settings → Secrets → Actions)"; exit 1; }
          if [ "$APPLY" = "true" ]; then
            node scripts/fill-search-keywords.js --apply
          else
            node scripts/fill-search-keywords.js
          fi

      - name: Publish catalog (so the storefront search sees the keywords)
        if: ${{ inputs.apply && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-catalog.yml --ref main
