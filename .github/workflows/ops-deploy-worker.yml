# Toolbox: build the storefront and deploy the Worker directly with wrangler —
# independent of Cloudflare's git auto-build (useful for hotfixes, rollbacks to a
# ref, or when the auto-build is slow/stuck). Requires the CLOUDFLARE_API_TOKEN
# repository secret (Workers Scripts: Edit on the account).
name: ops-deploy-worker

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build & deploy (branch / tag / sha)"
        default: "main"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard — token present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN secret not set (repo Settings → Secrets → Actions)"; exit 1; }

      - name: Build storefront
        working-directory: Frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7e3908ec50c0d81a964afd3cb7f90a4f
        run: |
          set -o pipefail  # a wrangler failure must not be masked by the tee pipe
          npm ci --no-audit --no-fund
          npx wrangler deploy | tee -a "$GITHUB_STEP_SUMMARY"
